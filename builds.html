<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build 参考 - Ecliptica 日蚀攻略站</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<header>
  <nav class="nav">
    <div class="brand">☀ Ecliptica <small>日蚀攻略站</small></div>
    <a class="navlink" href="index.html">首页</a>
    <a class="navlink" href="classes.html">职业</a>
    <a class="navlink" href="upgrades.html">游戏图鉴</a>
    <a class="navlink active" href="builds.html">Build 参考</a>
    <a class="navlink" href="simulator.html">加点模拟器</a>
    <a class="navlink" href="stats.html">属性上限</a>
    <a class="navlink" href="changelog.html">版本日志</a>
    <span class="ver-tag" id="verTag"></span>
  </nav>
</header>
<main>
  <div class="page-head">
    <h1>Build 参考</h1>
  </div>

  <nav id="buildTabs" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px"></nav>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center">
    <span style="color:var(--text-dim);font-size:13px">🌐 社区分享 Build 来自 <b style="color:var(--accent)">Ecliptica 中文支部</b>（VRCT 客户端共享加点方案）：VRChat 群组 <a href="https://vrc.group/GAME.0421" target="_blank" style="color:var(--blue)">vrc.group/GAME.0421</a> · QQ 群 <b style="color:var(--accent)">614460762</b></span>
  </div>
  <div id="archTabs" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px"></div>

  <div id="buildList"></div>
</main>
<footer>
  Ecliptica 日蚀攻略站 · Build 来源：日文wiki build页 + B站社区实战 · 非官方粉丝站<br>
  数据更新至 v0.51（2026-07-29）
<br><span style="color:var(--text-dim);opacity:.8;font-size:11.5px">Made by <b>Hoshiha</b> · B站 @void星葉</span>
</footer>
<nav class="bottom-nav"><a href="index.html" class=""><span class="bn-ico">🏠</span>首页</a><a href="classes.html" class=""><span class="bn-ico">⚔️</span>职业</a><a href="upgrades.html" class=""><span class="bn-ico">📖</span>图鉴</a><a href="builds.html" class="active"><span class="bn-ico">🛠️</span>Build</a><a href="simulator.html" class=""><span class="bn-ico">🎯</span>模拟器</a><a href="stats.html" class=""><span class="bn-ico">📊</span>属性</a><a href="changelog.html" class=""><span class="bn-ico">📜</span>日志</a></nav>
<script src="data.js"></script>
<script>
const D = ECLIPTICA_DATA;
document.getElementById('verTag').textContent = D.meta.version;

const skillName = id => {
  for (const s of D.shops) for (const sk of s.skills) if (sk.id === id) return {zh:sk.zh, en:sk.en};
  for (const c of D.classes) for (const sk of (D.class_upgrades[c.id]||[])) if (sk.id === id) return {zh:sk.zh, en:sk.en};
  return {zh:id, en:''};
};

let currentCls = null;
let currentArch = null;

// 自定义 Build（与模拟器同 key 的 localStorage）
const CUSTOM_KEY = 'ecliptica_custom_builds_v1';
let customBuilds = [];
function loadCustomBuilds() {
  try { customBuilds = JSON.parse(localStorage.getItem(CUSTOM_KEY)) || []; }
  catch(e) { customBuilds = []; }
}
loadCustomBuilds();

const runeName = id => { const r = D.runes.find(x => x.id === id); return r ? r.zh : id; };
const artName = id => { const a = D.artifacts.find(x => x.id === id); return a ? a.zh : id; };
const clsName = id => { const c = D.classes.find(x => x.id === id); return c ? c.zh : id; };

// 职业 tabs（最前面加"自定义 Build"栏目）
const tabs = document.getElementById('buildTabs');
tabs.insertAdjacentHTML('afterbegin', `<button data-cls="__custom__" style="background:rgba(86,156,255,.12);border:1px solid var(--blue);color:var(--blue);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">✏️ 自定义 Build ${customBuilds.length ? `<small>(${customBuilds.length})</small>` : ''}</button>`);
D.classes.forEach(c => {
  tabs.insertAdjacentHTML('beforeend', `<button data-cls="${c.id}" style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px">${c.zh} <small style="color:var(--text-dim)">${c.en}</small></button>`);
});

function buildOf2(clsId, archId) {
  if (archId && archId.startsWith('vrct_')) return (D.vrct_builds||[]).find(b => b.classId === clsId && b.archetypeId === archId) || null;
  return D.builds.find(b => b.classId === clsId && b.archetypeId === archId);
}

// ---------- 分级选择：职业层 → 流派层 → 选中收起（点击已选项 = 取消该级选择） ----------
function clsBtnHtml(cid, active, tag) {
  const c = D.classes.find(x => x.id === cid);
  return `<button data-cls="${cid}" style="background:${active?'rgba(240,180,41,.15)':'var(--bg3)'};border:1px solid ${active?'var(--accent)':'var(--border)'};color:${active?'var(--accent)':'var(--text)'};padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px">${tag}${c.zh} <small style="color:var(--text-dim)">${c.en}</small></button>`;
}
function archBtnHtml(archId, name, tag, active) {
  return `<button data-arch="${archId}" style="background:${active?'rgba(240,180,41,.15)':'var(--bg3)'};border:1px solid ${active?'var(--accent)':'var(--border)'};color:${active?'var(--accent)':'var(--text)'};padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13.5px">${tag}${name}</button>`;
}
function renderClsBar() {
  const bar = document.getElementById('buildTabs');
  if (currentCls) {
    // 已选职业：只保留当前职业按钮（+ 取消提示）
    bar.innerHTML = (currentCls === '__custom__')
      ? `<button data-cls="__custom__" style="background:rgba(86,156,255,.12);border:1px solid var(--blue);color:var(--blue);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">✏️ 自定义 Build ${customBuilds.length ? `<small>(${customBuilds.length})</small>` : ''} <small style="opacity:.7">✓ 点此取消</small></button>`
      : clsBtnHtml(currentCls, true, '') + ` <small style="color:var(--text-dim);font-size:12px;align-self:center">✓ 点职业按钮取消选择</small>`;
  } else {
    // 未选职业：全部职业按钮 + 自定义入口
    bar.innerHTML = `<button data-cls="__custom__" style="background:rgba(86,156,255,.12);border:1px solid var(--blue);color:var(--blue);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600">✏️ 自定义 Build ${customBuilds.length ? `<small>(${customBuilds.length})</small>` : ''}</button>`
      + D.classes.map(c => clsBtnHtml(c.id, false, '')).join('');
  }
  bar.querySelectorAll('button[data-cls]').forEach(btn => btn.onclick = () => {
    if (btn.dataset.cls === currentCls) {
      // 点击已选职业 = 取消选择（联动清除流派）
      currentCls = null;
      currentArch = null;
      document.getElementById('archTabs').innerHTML = '';
      document.getElementById('buildList').innerHTML = '';
      renderClsBar();
      return;
    }
    // 选择职业：收起其他职业，展开该职业全部流派
    currentCls = btn.dataset.cls;
    currentArch = null;
    renderClsBar();
    if (currentCls === '__custom__') {
      document.getElementById('archTabs').innerHTML = '';
      renderCustomList();
    } else {
      fillArchTabs(true);
      renderBuild();
    }
  });
}
function fillArchTabs(expanded) {
  const box = document.getElementById('archTabs');
  if (!currentCls || currentCls === '__custom__') { box.innerHTML = ''; return; }
  const bs = D.builds.filter(b => b.classId === currentCls);
  const vbs = (D.vrct_builds||[]).filter(b => b.classId === currentCls);
  const archList = bs.map(b => ({ id: b.archetypeId, name: b.archetype, tag: '' }))
    .concat(vbs.map(b => ({ id: b.archetypeId, name: b.archetype, tag: '🌐 ' })));
  if (currentArch && !expanded) {
    // 已选流派：只保留当前流派按钮（点击 = 取消选择 → 展开全部）
    const sel = archList.find(a => a.id === currentArch);
    if (sel) box.innerHTML = archBtnHtml(sel.id, sel.name, sel.tag, true) + ` <small style="color:var(--text-dim);font-size:12px;align-self:center">✓ 点流派按钮取消选择</small>`;
    else box.innerHTML = '';
  } else {
    box.innerHTML = '<span style="color:var(--text-dim);font-size:13px;align-self:center">流派：</span>'
      + archList.map(a => archBtnHtml(a.id, a.name, a.tag, a.id === currentArch)).join('');
  }
  box.querySelectorAll('button[data-arch]').forEach(btn => btn.onclick = () => {
    if (btn.dataset.arch === currentArch) {
      // 点击已选流派 = 取消选择 → 展开全部流派
      currentArch = null;
      fillArchTabs(true);
      renderBuild();
      return;
    }
    // 选择流派：收起其他流派，显示详情
    currentArch = btn.dataset.arch;
    fillArchTabs(false);
    renderBuild();
  });
}

// 自定义 Build 栏目：全部自定义方案列表
function renderCustomList() {
  document.getElementById('archTabs').innerHTML = '';
  if (!customBuilds.length) {
    document.getElementById('buildList').innerHTML = `<div class="card"><h2>✏️ 自定义 Build</h2>
      <p style="color:var(--text-dim);font-size:14px">还没有保存的自定义 Build。<br><br>在 <a href="simulator.html" style="color:var(--blue)">加点模拟器</a> 中完成加点（≥21 点）后，点「💾 存为自定义 Build」即可在这里查看和管理。</p></div>`;
    return;
  }
  const html = customBuilds.map(b => {
    const total = (b.must||[]).reduce((a,m)=>a+(m.count||0),0);
    const runesTxt = (b.runes||[]).map((rid,i)=>`<span class="badge">符文${i+1}：${runeName(rid)}（×${i+1}）</span>`).join('') || '<span style="color:var(--text-dim)">无</span>';
    const artsTxt = (b.artifacts||[]).map(([aid,n])=>`<span class="badge">${artName(aid)}×${n}</span>`).join('') || '<span style="color:var(--text-dim)">无</span>';
    return `<div class="card">
      <h2>✏️ ${b.archetype} <span style="font-size:13px;color:var(--text-dim)">${clsName(b.classId)} · 自定义</span>
        <button data-del="${b.archetypeId}" style="float:right;background:none;border:1px solid var(--red);color:var(--red);padding:3px 10px;border-radius:6px;cursor:pointer;font-size:12px">🗑 删除</button></h2>
      <p style="font-size:13px;color:var(--text-dim)">${b.note||''} · 来源：${b.source}</p>
      <div class="build-block build-must">
        <h4 style="color:var(--red)">🟥 技能加点（共 ${total} 层 / ${(b.must||[]).length} 项）</h4>
        ${(b.must||[]).map(it => { const n = skillName(it.id); const cnt = it.count ? `<span class="cnt">×${it.count}</span>` : ''; return `<div class="build-item">${cnt} <b>${n.zh}</b> <span class="en">${n.en}</span> — <span class="why">${it.reason}</span></div>`; }).join('')}
      </div>
      <div class="build-block">
        <h4 style="color:var(--blue)">🔷 符文（按槽位倍率）</h4>
        <div style="padding:4px 0">${runesTxt}</div>
      </div>
      <div class="build-block">
        <h4 style="color:var(--accent)">🏺 神器（跨小局累积）</h4>
        <div style="padding:4px 0">${artsTxt}</div>
      </div>
      <p style="font-size:13px;color:var(--text-dim)">${b.playstyle||''}</p>
    </div>`;
  }).join('');
  document.getElementById('buildList').innerHTML = html;
  document.querySelectorAll('[data-del]').forEach(btn => btn.onclick = () => {
    if (!confirm(`删除自定义 Build「${customBuilds.find(x=>x.archetypeId===btn.dataset.del).archetype}」？`)) return;
    customBuilds = customBuilds.filter(x => x.archetypeId !== btn.dataset.del);
    try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(customBuilds)); } catch(e) {}
    tabs.querySelector('[data-cls="__custom__"]').innerHTML = `✏️ 自定义 Build ${customBuilds.length ? `<small>(${customBuilds.length})</small>` : ''}`;
    renderCustomList();
  });
}

function renderBuild() {
  const b = buildOf2(currentCls, currentArch);
  if (!b) {
    document.getElementById('buildList').innerHTML = currentCls
      ? `<div class="card"><p style="color:var(--text-dim);font-size:14px">👆 选择一个流派查看 Build 详情。</p></div>`
      : '';
    return;
  }
  const c = D.classes.find(x => x.id === b.classId);
  const block = (title, items, cls, headColor) => items && items.length ? `
    <div class="build-block ${cls}">
      <h4 style="color:${headColor}">${title}</h4>
      ${items.map(it => {
        const n = skillName(it.id);
        const cnt = it.count ? `<span class="cnt">×${it.count}</span>` : '';
        return `<div class="build-item">${cnt} <b>${n.zh}</b> <span class="en">${n.en}</span> — <span class="why">${it.reason}</span></div>`;
      }).join('')}
    </div>` : '';
  document.getElementById('buildList').innerHTML = `
    <div class="card">
      <h2>${c.zh}（${c.en}）· ${b.archetype} <span style="font-size:13px;color:var(--text-dim)">${b.title}</span></h2>
      <p style="font-size:13px;color:var(--text-dim)">适用版本：<b style="color:var(--accent)">${b.patch}</b> · 来源：${b.source}</p>
      ${block('🟥 必须（最终形态核心）', b.must, 'build-must', 'var(--red)')}
      ${block('🟦 准必须 / 可选（后期溢出优先补）', b.nice, 'build-nice', 'var(--blue)')}
      ${block('⬛ 不要（浪费点数 / 副作用大）', b.avoid, 'build-avoid', 'var(--text-dim)')}
      <h3>玩法要点</h3>
      <p style="font-size:14px">${b.playstyle}</p>
      ${b.reroll ? `<h3>Reroll / 商店策略</h3><p style="font-size:14px">${b.reroll}</p>` : ''}
      <div class="tip">💡 把该方案作为「最终目标」在 <a href="simulator.html?cls=${c.id}&arch=${b.archetypeId}">加点模拟器</a> 中对照：模拟器会按你当前加点状态给出接下来的优先级推荐。</div>
    </div>`;
}

// 初始化：URL 参数定位（无参数时显示全部职业）
const q = new URLSearchParams(location.search);
const qCls = q.get('cls');
const qArch = q.get('arch');
currentCls = (qCls && D.classes.some(c=>c.id===qCls)) ? qCls : null;
currentArch = null;
renderClsBar();
if (currentCls) {
  if (currentCls === '__custom__') { renderCustomList(); }
  else {
    const bs0 = D.builds.filter(b => b.classId === currentCls);
    const vbs0 = (D.vrct_builds||[]).filter(b => b.classId === currentCls);
    const all = bs0.map(b=>b.archetypeId).concat(vbs0.map(b=>b.archetypeId));
    currentArch = (qArch && all.includes(qArch)) ? qArch : null;
    fillArchTabs(!!currentArch);
    renderBuild();
  }
}
</script>
<script src="site.js"></script>
</body>
</html>
